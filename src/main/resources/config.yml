puzzle:
  seconds: 30
  wrong-attempts: 3
  cancel-damage: 4.0 # 4 HP efectivos = 2 corazones, acumulados por intento
  show-damage-debug: true # Muestra avance en actionbar tras cada golpe
  cables: 5 # v1 usa exactamente cinco
  require-active-event: true
reactor:
  player-radius: 65.0 # participantes afectados en torno al reactor
  locations: [] # Se gestiona con /preactor crear
failure:
  consume-totem: true # intento de activar UN totem mediante dano letal
  damage-without-totem: 14.0 # 7 corazones, puede matar
  strength-seconds: 45
  mutation-seconds: 3600
  heal-boss-fraction: 0.10
success:
  weakness-seconds: 15 # debilidad temporal (no anula regeneracion nativa del mod)
